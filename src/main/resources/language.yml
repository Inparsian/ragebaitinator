# This is where you'd customize plugin messages.
#
# The most simple customizations to make without deep diving into individual command messages:
# prefix - The prefix to display before plugin messages.
# primaryColor - The primary color to use for plugin messages. The default is &c
# secondaryColor - The secondary color to use for plugin messages. The default is &f
# tertiaryColor - The tertiary color to use for plugin messages. The default is &7
#
# To customize individual command messages, you are encouraged to follow this config's color scheme.
# That is, instead of using raw color codes, use the colors defined in this config with their short placeholders.
# %c1% represents the primary color, %c2% represents the secondary color, and so on.
#
# PAPI placeholders are also supported here.
#
# You will have to look at the source code for messages that are undocumented, but here are some of the ones you
# can change:
#
# usage
# The command usage message sent if not enough arguments are provided.
# %command% is the command name, %syntax% is the command syntax.
#
# mustBeAPlayer
# The error message when a player-only command is used by a non-player.
#
# playerNotFound
# The error message when a player is not found.
#
# immune
# The error message when the targeted player is immune to a troll.
# %player% is the targeted player's name, %command% is the command name.
#
# conditionsFail
# The error message when the conditions for a troll are not met.
# %message% is the error message for the first condition that failed.
#
# commands.reload.success
# Sent when the configs have been reloaded. %time% is the time it took to reload the configs.
#
# commands.<troll>.init
# Sent when a troll command has been successfully executed (or enabled for toggleTroll).
# This can have multiple variations - for example, /rb bomb also has initArrow, initSnowball, and initEgg.
#
# command.<toggleTroll>.deinit
# Sent when a toggle troll command has been successfully disabled.
# This can have multiple variations - for example, /rb bomb also has deinitArrow, deinitSnowball, and deinitEgg.

#
# commands.<command>.description
# What a command is described as in /rb help and in the GUI. Without it, the command's built-in description is used.
#
# commands.<command>.parameters.<parameter>.name
# commands.<command>.parameters.<parameter>.description
# What a parameter of a command is called and described as in the GUI. <parameter> is its name in the command's syntax,
# like Persistent in /rb boombreak.
#
# categories.<category>.name
# categories.<category>.description
# What a category of trolls is called and described as in /rb help and in the GUI.
#
# Everything in the GUI is in the gui section below, and it follows the same color scheme as everything else.
# Items that are in a state, like trolls that are enabled or not, have a separate message for each state, with the color
# it should have in it. Where a message is a list of lines, a line that is nothing but a placeholder, like %description%,
# is replaced by as many lines as it takes. PAPI placeholders are not supported in the GUI.
#
# The placeholders that each message can use are listed with it. %prefix%, %version%, %plugin%, and the colors are
# always available.

categories:
  explosives:
    name: "Explosives"
    description: "Things that go boom."
  hazards:
    name: "Mobs & Hazards"
    description: "Mobs, projectiles and other things out to get a player."
  world:
    name: "Blocks & World"
    description: "Changes to the blocks and the world around a player."
  movement:
    name: "Movement"
    description: "Changes to how a player moves, falls and flies."
  inventory:
    name: "Inventory & Items"
    description: "What a player carries, picks up and uses."
  combat:
    name: "Combat"
    description: "Changes to how a player fights and takes hits."
  survival:
    name: "Health & Hunger"
    description: "Health, hunger, sleep and respawning."
  chat:
    name: "Chat & Commands"
    description: "Changes what a player says, and what happens when they say it."
  illusions:
    name: "Illusions & Scares"
    description: "Things only the player sees, hears or feels."
  misc:
    name: "Miscellaneous"
    description: "Everything else."

gui:
  # Messages that are sent in chat while the GUI is waiting for something to be typed in.
  # %field% is what is being asked for, %completions% are the values that can be typed in, %value% is what was typed in,
  # %query% is what is being searched for, and %type% is the kind of value that was expected.
  messages:
    fieldPrompt: "%prefix% %c2%Please enter a value for %c1%%field%"
    fieldCompletions: "%prefix% %c2%Possible values: %c1%%completions%"
    fieldInvalidCompletion: "%prefix% &cThis value must be one of the possible values listed above"
    fieldInvalidPlayer: "%prefix% &cPlayer(s) not found"
    fieldInvalid: "%prefix% &cInvalid %type%"
    fieldSet: "%prefix% %c2%Set %c1%%field% %c2%to %c1%%value%"
    cancelHint: "%prefix% %c2%Type %c1%cancel %c2%to go back."
    cancelled: "%prefix% %c2%Cancelled."
    searchSet: "%prefix% %c2%Searching for %c1%%query%"

  # What the kinds of values that a parameter can have are called.
  types:
    string: "String"
    boolean: "Boolean"
    integer: "Integer"
    long: "Long"
    float: "Float"
    double: "Double"
    player: "Player"
    enum: "Choice"

  # Items that are on every menu with pages. The page is in the middle of the bottom row.
  common:
    back:
      name: "%c1%Back"
    refresh:
      name: "%c1%Refresh"
    firstPage:
      name: "%c1%First Page"
    previousPage:
      name: "%c1%Previous Page"
    nextPage:
      name: "%c1%Next Page"
    lastPage:
      name: "%c1%Last Page"
    # %page% and %pages% are the page that's open and how many there are.
    page:
      name: "%c3%Page %c1%%page%%c3%/%c1%%pages%"

  selection:
    # What a number of players that are managed together are called. %count% is how many there are.
    many: "%count% players"

  main:
    title: "Ragebaitinator"
    players:
      name: "%c1%Players"
      lore:
        - "%c3%Manage players."
    overview:
      name: "%c1%Overview"
      # %players% is how many players have a troll on.
      lore:
        - "%c3%See who is being trolled right now."
        - ""
        - "%c1%%players% %c3%player(s) have trolls on."
    history:
      name: "%c1%History"
      # %count% is how many commands have been executed.
      lore:
        - "%c3%View command history. To date, a total of"
        - "%c1%%count% %c3%command(s) have been executed."
    reload:
      name: "%c1%Reload Configs"
      lore:
        - "%c3%Reloads the plugin's configuration files."
    info:
      name: "%c1%&lRagebaitinator"
      # %trolls% is how many trolls there are.
      lore:
        - "%c3%You are running %c1%Ragebaitinator v%version%"
        - "%c3%made by %c1%Inparsian%c3%!"
        - ""
        - "%c3%This plugin has a total of %c1%%trolls% %c3%trolls!"

  players:
    # %page% and %pages% are the page that's open and how many there are.
    title: "Players (%page%/%pages%)"
    head:
      name: "%c2%%player%"
      # This is the name of a player who has been chosen, which a number of players can be to manage them together.
      selectedName: "&a%player%"
      # %enabled% and %total% are how many toggle trolls are on and there are. %trolls% are the ones that are on, as many as
      # fit, in the color of the state they're in (see gui.troll.name).
      lore:
        - "%c3%Trolls on: &a%enabled%%c3%/%c2%%total%"
        - "%trolls%"
      # What is listed when none are on, and what is added to the list when there are too many. %count% is how many more there are.
      none: "%c2%None"
      more: "%c3%...and %c2%%count% %c3%more"
      # These are only added to a player who has been chosen, and to one who isn't the one whose menu it is.
      selected:
        - ""
        - "&aSelected"
      manage:
        - ""
        - "%c3%Left click to manage this player."
        - "%c3%Right click to select this player."
    # What is done with the players that have been chosen. %count% is how many there are.
    selection:
      all:
        name: "%c1%Select Everyone"
        lore:
          - "%c3%Selects every player that is online."
      clear:
        name: "%c1%Clear Selection"
        lore:
          - "%c3%Selects nobody."
      continue:
        name: "&aContinue"
        lore:
          - "%c3%Manage the %c1%%count% %c3%player(s) that you"
          - "%c3%selected, all at once."

  player:
    # %player% is the player the menu is about, or how many there are if it's about more than one.
    title: "%player%"
    # What stands in for the head of a player when there are a number of them. %count% is how many there are, %enabled% is
    # how many toggle trolls are on for any of them, and %players% are their names.
    group:
      name: "%c2%%count% Players"
      lore:
        - "%players%"
        - ""
        - "%c3%Toggle trolls on for any of them: %c2%%enabled%"
    browse:
      name: "%c1%Browse Trolls"
      lore:
        - "%c3%Find a troll to use."
    active:
      name: "%c1%Active Trolls"
      # %count% is how many toggle trolls are on.
      lore:
        - "%c3%The trolls that are on right now."
        - ""
        - "%c3%On: %c2%%count%"
    pardon:
      name: "%c1%Pardon"
      lore:
        - "%c3%Disables all persistent trolls."

  # The menu with every troll in it. At the top are the tabs, one for each way of looking at them.
  browser:
    # %target% is who the menu is about, %tab% is what's being looked at (see tabs), and %page% and %pages% are the page
    # that's open and how many there are.
    title: "%target% » %tab% (%page%/%pages%)"
    tab:
      # %tab% is the name of the tab.
      name: "%c1%%tab%"
      selectedName: "&a&l%tab%"
      view: "%c3%Click to view."
      viewing: "&aViewing."
    # What the tabs are called. The name is on the tab, and the title is in the title of the menu. Each category has the
    # name and description it has in categories. In the lore, %description% is the description, %count% is how many trolls
    # there are, %enabled% and %toggles% are how many toggle trolls of a category are on and there are, and %target% is who
    # the menu is about.
    tabs:
      active:
        name: "&aActive"
        title: "Active"
        description: "Everything that is on right now."
        lore:
          - "%description%"
          - ""
          - "%c3%Trolls on for %c2%%target%%c3%: %c2%%count%"
      all:
        name: "%c2%All Trolls"
        title: "All Trolls"
        description: "Every troll, in alphabetical order."
        lore:
          - "%description%"
          - ""
          - "%c3%Trolls: %c2%%count%"
      category:
        lore:
          - "%description%"
          - ""
          - "%c3%Trolls: %c2%%count%"
          - "%c3%On for %c2%%target%%c3%: %c2%%enabled%%c3%/%c2%%toggles%"
      # %query% is what is being searched for.
      search:
        title: "Search: %query%"
    search:
      name: "%c1%Search"
      lore:
        - "%c3%Find trolls by name or description."
      # What the player is told is being asked for, when they're asked what to search for.
      field: "a search term"
    clear:
      name: "%c1%Clear Search"
      lore:
        - "%c3%Goes back to every troll."
    # This is shown in place of the trolls when there are none to show.
    empty:
      name: "%c2%Nothing here"
      active:
        - "%c3%No trolls are on for %c2%%target%%c3%."
      search:
        - "%c3%No troll matches %c2%%query%%c3%."
      none:
        - "%c3%There are no trolls to show."

  # How a troll is shown, both in the lists of them and on the menu of its parameters.
  troll:
    # %troll% is the name of the troll. A toggle has the second name when it's on for some of the players being managed together,
    # and not all of them.
    name:
      enabled: "&a%troll%"
      disabled: "&c%troll%"
      partial: "&e%troll%"
      once: "&6%troll%"
    # %state% is one of the states below.
    type:
      toggle: "%c3%Type: %c1%Toggle %c3%(%state%%c3%)"
      once: "%c3%Type: &6One-time"
    # %on% and %total% are how many of the players being managed together a toggle is on for, and how many there are.
    state:
      enabled: "&aEnabled"
      disabled: "&cDisabled"
      partial: "&eEnabled for %on%/%total%"
    # This is only shown when a troll can't be used on somebody. %reason% is the condition that isn't met, %player% is who it
    # isn't met for when it's more than one, and %count% is how many more reasons there are than are listed.
    blocked:
      header: "&cCan't be used right now:"
      line: "%c3%- &c%reason%"
      many: "%c3%- &c%player%: %reason%"
      immune: "Immune to this troll"
      more: "%c3%...and %c2%%count% %c3%more"
    click:
      toggle: "%c3%Left click to toggle."
      execute: "%c3%Left click to execute."
      options: "%c3%Right click for options."
      configure: "%c3%Click to fill in its parameters."
      partial: "%c3%Some of them don't have it on yet, so this switches it on for them."

  # The menu where the parameters of a troll are filled in.
  parameters:
    # %troll% is the name of the troll and %target% is who it's for.
    title: "%troll% » %target%"
    item:
      # %name% is the name of the parameter. The names for a true and false value are for parameters that are either.
      name: "%c1%%name%"
      nameTrue: "&a%name%"
      nameFalse: "&c%name%"
      # %description% is its description, %type% is what kind of value it is, and %optional% is one of the below.
      lore:
        - "%description%"
        - ""
        - "%c3%Type: %c2%%type%"
        - "%c3%Optional: %optional%"
      noDescription: "%c2%No description."
      optional: "&aYes"
      required: "&cNo"
      # %min% and %max% are the limits of a number, and %default% is what a parameter is if it's left alone.
      range:
        - "%c3%Range: %c2%%min% %c3%to %c2%%max%"
      default:
        - "%c3%Default: %c2%%default%"
      # %value% is the value it has now.
      value:
        - "%c3%Current Value"
        - "%c2%%value%"
      noValue:
        - "%c3%Current Value"
        - "&4None"
      # The choices of a parameter that has a list of them, with the one it has now in the second color.
      choices: "%c3%Choices:"
      choice: "%c3%- %c2%%value%"
      choiceCurrent: "&a- %value%"
    # What can be done with a parameter, which depends on what kind it is. %step% is how much a click changes a number by.
    controls:
      boolean:
        - "%c3%Click to switch."
      number:
        - "%c3%Left click: %c2%+%step%"
        - "%c3%Right click: %c2%-%step%"
        - "%c3%Hold shift to change it ten times as much."
        - "%c3%Press Q to type a value."
      choice:
        - "%c3%Left click for the next choice."
        - "%c3%Right click for the one before."
      text:
        - "%c3%Click to type a value."
    reset:
      name: "%c1%Reset to Defaults"
      lore:
        - "%c3%Puts every parameter back to its default."
    confirm:
      name: "&aConfirm"
      # %command% is the command that will be run.
      lore:
        - "%c3%Runs:"
        - "%c2%/rb %command%"
    # This is what the confirm item is while a parameter that's needed doesn't have a value.
    confirmBlocked:
      name: "&4Confirm"
      lore:
        - "%c3%Fill in every required parameter first."

  # Who is being trolled right now.
  overview:
    # %page% and %pages% are the page that's open and how many there are.
    title: "Overview (%page%/%pages%)"
    # %players% is how many players have a troll on, and %trolls% is how many trolls are on in all.
    summary:
      name: "%c1%Overview"
      lore:
        - "%c3%Players with trolls on: %c2%%players%"
        - "%c3%Trolls on in total: %c2%%trolls%"
    head:
      manage:
        - ""
        - "%c3%Left click to see what is on."
        - "%c3%Right click to manage them."
    pardonAll:
      name: "%c1%Pardon Everyone"
      lore:
        - "%c3%Disables all persistent trolls for everyone here."
    empty:
      name: "%c2%Nobody is being trolled"
      lore:
        - "%c3%No troll is on for anyone right now."

  history:
    title: "History (%page%/%pages%)"
    # What the server's name is, in place of that of a player.
    server: "%c1%Server"
    entry:
      # %command% is the command that was executed, %executor% is who executed it, and %time% is when.
      name: "%c1%%command%"
      lore:
        - "%c3%Executed by:"
        - "%c2%%executor%"
        - ""
        - "%c3%Executed at:"
        - "%c2%%time%"
